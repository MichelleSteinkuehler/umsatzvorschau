<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umsatzvorschau</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a1a; padding: 2rem; min-height: 100vh; }
    #app { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 1.4rem; font-weight: 500; margin-bottom: 0.25rem; }
    .sub { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .tarif-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .tarif-row:last-child { border-bottom: none; }
    .error { background: #fff0f0; border: 1px solid #fcc; border-radius: 8px; padding: 0.75rem 1rem; color: #c00; font-size: 0.85rem; margin-bottom: 1rem; }
    .month-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.6rem; cursor: pointer; transition: border-color 0.15s; }
    .month-card:hover { border-color: #aaa; }
    .month-card.active { border-color: #3b82f6; background: #eff6ff; }
    .month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .month-name { font-weight: 500; font-size: 0.95rem; }
    .month-count { font-size: 0.8rem; color: #888; }
    .bar-bg { height: 5px; background: #eee; border-radius: 3px; margin-bottom: 8px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: #3b82f6; }
    .month-nums { display: flex; gap: 1.5rem; font-size: 0.85rem; flex-wrap: wrap; }
    .lbl { color: #888; }
    .val { font-weight: 500; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 1rem; }
    .stat { background: #f5f5f3; border-radius: 8px; padding: 0.75rem 1rem; }
    .stat-label { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
    .stat-val { font-size: 1.2rem; font-weight: 500; }
    .detail-title { font-weight: 500; font-size: 1rem; margin-bottom: 0.75rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: #888; font-weight: 400; padding: 6px 8px; border-bottom: 1px solid #eee; }
    td { padding: 7px 8px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .badge { font-size: 0.72rem; background: #f0f0f0; border-radius: 4px; padding: 2px 6px; color: #555; white-space: nowrap; }
    .btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 0.65rem 1.25rem; font-size: 0.95rem; cursor: pointer; }
    .btn:hover { background: #333; }
    .btn-link { background: none; border: none; color: #3b82f6; cursor: pointer; font-size: 0.85rem; padding: 0; text-decoration: underline; }
    .note { font-size: 0.78rem; color: #888; margin-top: 0.75rem; }
    .loading { text-align: center; padding: 3rem 1rem; color: #888; font-size: 0.95rem; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const CLIENT_ID = "230766882048-ngq885knj0u945gfrkgqfifn5t1l4fje.apps.googleusercontent.com";
const REDIRECT_URI = window.location.origin + window.location.pathname;

const TARIFE_TITEL = [
  { key: "Erstgespräch lang",   betrag: 38.28 },
  { key: "Erstgespräch privat", betrag: 0     },
  { key: "Erstgespräch",        betrag: 9.80  },
  { key: "Beratung privat",     betrag: 120.00},
];

const BERATUNG_TARIFE = [
  { minuten: 30, betrag: 47.20, label: "Beratung 30 Min." },
  { minuten: 60, betrag: 71.20, label: "Beratung 60 Min." },
];

function matchTarif(title, dauerMinuten) {
  if (!title) return null;
  const t = title.trim().toLowerCase();
  if (t.startsWith("beratung") && !t.includes("privat")) {
    const tarif = BERATUNG_TARIFE.find(b => b.minuten === dauerMinuten);
    if (tarif) return { key: tarif.label, betrag: tarif.betrag };
    const closest = BERATUNG_TARIFE.reduce((a, b) =>
      Math.abs(b.minuten - dauerMinuten) < Math.abs(a.minuten - dauerMinuten) ? b : a
    );
    return { key: closest.label + " (ca.)", betrag: closest.betrag };
  }
  for (const tarif of TARIFE_TITEL) {
    if (t.includes(tarif.key.toLowerCase())) return { key: tarif.key, betrag: tarif.betrag };
  }
  return null;
}

function fmt(n) {
  return n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
}

function monthKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function monthLabel(mk) {
  const [y, m] = mk.split("-");
  return new Date(y, m-1, 1).toLocaleString("de-DE", { month: "long", year: "numeric" });
}

let state = { view: "login", error: null, months: {}, selected: null, token: null };

function render() {
  const app = document.getElementById("app");
  if (state.view === "login") app.innerHTML = renderLogin();
  else if (state.view === "loading") app.innerHTML = renderLoading();
  else app.innerHTML = renderDashboard();
  bindEvents();
}

function renderLogin() {
  return `
    <h1>Umsatzvorschau</h1>
    <p class="sub">Automatisch aus deinem Google Kalender</p>
    ${state.error ? `<div class="error">${state.error}</div>` : ""}
    <div class="card" style="margin-bottom:1.5rem;">
      <div style="font-weight:500;font-size:.9rem;margin-bottom:.6rem;">Erkannte Termintypen</div>
      ${TARIFE_TITEL.map(t => `<div class="tarif-row"><span>${t.key}</span><span style="font-weight:500">${fmt(t.betrag)}</span></div>`).join("")}
      ${BERATUNG_TARIFE.map(t => `<div class="tarif-row"><span>${t.label}</span><span style="font-weight:500">${fmt(t.betrag)}</span></div>`).join("")}
      <div class="tarif-row" style="margin-top:6px;"><span>Rücklage</span><span style="font-weight:500">30 % des Umsatzes</span></div>
    </div>
    <button class="btn" onclick="startOAuth()">🔗 Mit Google Kalender verbinden</button>
    <p class="note">Nur Lesezugriff auf deinen Kalender. Keine Daten werden gespeichert.</p>`;
}

function renderLoading() {
  return `<h1>Umsatzvorschau</h1><div class="loading">⏳ Kalender wird geladen …</div>`;
}

function renderDashboard() {
  const keys = Object.keys(state.months).sort();
  const maxU = Math.max(...keys.map(k => state.months[k].umsatz), 1);
  const sel = state.selected;
  const selData = sel ? state.months[sel] : null;
  const now = new Date().toLocaleString("de-DE", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });

  const monthsHtml = keys.length === 0
    ? `<div class="card">Keine passenden Termine gefunden.</div>`
    : keys.map(mk => {
        const { umsatz, ruecklage, events } = state.months[mk];
        const barW = Math.round((umsatz / maxU) * 100);
        return `<div class="month-card${mk === sel ? " active" : ""}" onclick="selectMonth('${mk}')">
          <div class="month-header">
            <span class="month-name">${monthLabel(mk)}</span>
            <span class="month-count">${events.length} Termin${events.length !== 1 ? "e" : ""}</span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${barW}%"></div></div>
          <div class="month-nums">
            <span><span class="lbl">Umsatz: </span><span class="val">${fmt(umsatz)}</span></span>
            <span><span class="lbl">Rücklage: </span><span class="val" style="color:#b45309">${fmt(ruecklage)}</span></span>
            <span><span class="lbl">Netto: </span><span class="val" style="color:#166534">${fmt(umsatz - ruecklage)}</span></span>
          </div>
        </div>`;
      }).join("");

  let detailHtml = "";
  if (selData) {
    const netto = selData.umsatz - selData.ruecklage;
    const sorted = [...selData.events].sort((a, b) => a.date - b.date);
    detailHtml = `<div class="card" style="margin-top:1.5rem;">
      <div class="detail-title">${monthLabel(sel)} – Details</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Umsatz gesamt</div><div class="stat-val">${fmt(selData.umsatz)}</div></div>
        <div class="stat"><div class="stat-label">Rücklage 30 %</div><div class="stat-val" style="color:#b45309">${fmt(selData.ruecklage)}</div></div>
        <div class="stat"><div class="stat-label">Verbleibend</div><div class="stat-val" style="color:#166534">${fmt(netto)}</div></div>
        <div class="stat"><div class="stat-label">Termine</div><div class="stat-val">${selData.events.length}</div></div>
      </div>
      <table>
        <thead><tr><th>Datum</th><th>Termin</th><th>Typ</th><th style="text-align:right">Betrag</th></tr></thead>
        <tbody>
          ${sorted.map(ev => `<tr>
            <td>${ev.date.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})}</td>
            <td>${ev.title}</td>
            <td><span class="badge">${ev.tarifKey}</span></td>
            <td style="text-align:right;font-weight:500">${fmt(ev.betrag)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
  }

  return `
    <h1>Umsatzvorschau</h1>
    <p class="sub">Zuletzt aktualisiert: ${now} · <button class="btn-link" onclick="loadCalendar()">🔄 Aktualisieren</button></p>
    ${monthsHtml}
    ${detailHtml}
    <p class="note" style="margin-top:1rem;"><button class="btn-link" onclick="logout()">← Abmelden</button></p>`;
}

function bindEvents() {}

function startOAuth() {
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "token",
    scope: "https://www.googleapis.com/auth/calendar.readonly",
  });
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
}

async function loadCalendar() {
  const token = state.token || sessionStorage.getItem("gtoken");
  if (!token) { logout(); return; }
  state.token = token;
  state.view = "loading";
  render();
  try {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth() - 2, 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 7, 0);
    const url = new URL("https://www.googleapis.com/calendar/v3/calendars/primary/events");
    url.searchParams.set("timeMin", start.toISOString());
    url.searchParams.set("timeMax", end.toISOString());
    url.searchParams.set("maxResults", "2500");
    url.searchParams.set("singleEvents", "true");
    url.searchParams.set("orderBy", "startTime");

    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) {
      sessionStorage.removeItem("gtoken");
      throw new Error("Sitzung abgelaufen – bitte neu anmelden.");
    }
    const data = await res.json();
    const grouped = {};
    for (const ev of (data.items || [])) {
      if (ev.status === "cancelled") continue;
      const startStr = ev.start?.dateTime || ev.start?.date;
      const endStr = ev.end?.dateTime || ev.end?.date;
      const date = new Date(startStr);
      const dauer = endStr ? Math.round((new Date(endStr) - date) / 60000) : 0;
      const tarif = matchTarif(ev.summary, dauer);
      if (!tarif) continue;
      const mk = monthKey(date);
      if (!grouped[mk]) grouped[mk] = { umsatz: 0, ruecklage: 0, events: [] };
      grouped[mk].events.push({ title: ev.summary, betrag: tarif.betrag, tarifKey: tarif.key, date });
      grouped[mk].umsatz += tarif.betrag;
    }
    for (const mk of Object.keys(grouped)) {
      grouped[mk].ruecklage = grouped[mk].umsatz * 0.3;
    }
    state.months = grouped;
    state.error = null;
    const ck = monthKey(now);
    const keys = Object.keys(grouped).sort();
    state.selected = grouped[ck] ? ck : (keys[0] || null);
    state.view = "dashboard";
    render();
  } catch(e) {
    state.view = "login";
    state.error = e.message;
    render();
  }
}

function selectMonth(mk) { state.selected = mk; render(); }

function logout() {
  sessionStorage.removeItem("gtoken");
  state = { view: "login", error: null, months: {}, selected: null, token: null };
  render();
}

// OAuth Redirect abfangen
const hash = new URLSearchParams(window.location.hash.replace("#",""));
const token = hash.get("access_token");
if (token) {
  sessionStorage.setItem("gtoken", token);
  window.history.replaceState(null, "", window.location.pathname);
  state.token = token;
  loadCalendar();
} else {
  const saved = sessionStorage.getItem("gtoken");
  if (saved) { state.token = saved; loadCalendar(); }
  else render();
}
</script>
</body>
</html>
